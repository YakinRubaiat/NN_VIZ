[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nnviz"
version = "0.2.0"
description = "Look inside a language model: its full architecture with every weight visible, its wiring as a 3-D brain, and activity playing through both, token by token."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "torch>=2.4", "transformers>=4.51",
  "safetensors>=0.4", "tokenizers>=0.21", "umap-learn>=0.5.5", "Pillow>=10.0",
]

[project.scripts]
nnviz = "nnviz.__main__:main"

[tool.setuptools]
packages = ["nnviz"]

[tool.setuptools.package-data]
nnviz = ["viewer/*.html", "viewer/css/*", "viewer/js/*", "viewer/vendor/*.js", "viewer/vendor/addons/controls/*"]
