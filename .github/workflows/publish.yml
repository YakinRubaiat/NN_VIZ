# Publish to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OIDC): no API token is stored in the repo.
# One-time setup on pypi.org → Account → Publishing → "Add a pending publisher":
#   PyPI project name: nnviz-mri   Owner: YakinRubaiat   Repository: NN_VIZ
#   Workflow name: publish.yml     Environment: pypi
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
